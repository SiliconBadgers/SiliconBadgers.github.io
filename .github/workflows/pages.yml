# Deploys the static site to GitHub Pages.
#
# This repo's Pages source is set to "GitHub Actions" (build_type: workflow).
# Without a workflow here, pushes to main are accepted but never published --
# which is how three commits, including the favicon fix, silently failed to
# reach the live site. Keeping the deploy definition in the repo means it is
# visible in review and cannot be undone by a settings toggle.
#
# The site is plain static HTML, so there is no build step: upload the repo
# as-is and publish it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
