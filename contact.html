<section id="contact" class="reveal">
  <h2>Contact</h2>
  <form id="contactForm" class="contact-form">
    <div class="form-row">
      <label for="contactName">Name</label>
      <input type="text" id="contactName" name="name" required>
    </div>
    <div class="form-row">
      <label for="contactEmail">Email <span class="optional">(if you're a UW-Madison student, please use your school email)</span></label>
      <input type="email" id="contactEmail" name="email" required>
    </div>
    <div class="form-row">
      <label for="contactMessage">Message</label>
      <textarea id="contactMessage" name="message" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary" id="contactSubmit">Send</button>
    <p class="form-status" id="contactStatus" role="status" aria-live="polite"></p>
  </form>
</section>
